
<!DOCTYPE html>
<html lang="fr">
<head>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f6f2;

    }
    header {
      background: #172b3a;
      color: white;
      padding: 28px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; letter-spacing: 2px; }
    nav a { color: white; margin-left: 20px; text-decoration: none; }

      padding: 100px 20px;

    }
    .hero h2 { font-size: 42px; }
    .hero p { font-size: 18px; }

      background: white;
      max-width: 300px;
      margin: 25px auto;
      padding: 30px;

  <header>
    <h1>NATHBOOK</h1>
    <nav><a href="#accueil">Accueil</a><a href="#boutique">Boutique</a></nav>
